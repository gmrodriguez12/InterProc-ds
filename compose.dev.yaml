services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./docker/nginx/dev/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports: !override
      - "127.0.0.1:8080:80"
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    working_dir: /workspace/frontend/interproc-web
    command: sh -lc "npm ci && npm start -- --host 0.0.0.0 --poll 1000 --proxy-config proxy.conf.json"
    volumes:
      - ./frontend:/workspace/frontend:cached
      - frontend_node_modules:/workspace/frontend/interproc-web/node_modules
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      NG_CLI_ANALYTICS: "false"
    expose:
      - "4200"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4200/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      api:
        condition: service_healthy
    networks:
      - interproc

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    working_dir: /src
    command: dotnet watch run --project InterProc.Api/InterProc.Api.csproj --urls http://0.0.0.0:8080
    volumes:
      - ./backend:/src:cached
      - backend_nuget:/root/.nuget/packages
      - data_protection_keys:/var/lib/interproc/keys
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:?Set POSTGRES_DB in .env};Username=${POSTGRES_USER:?Set POSTGRES_USER in .env};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DataProtection__KeysPath: /var/lib/interproc/keys
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - interproc

volumes:
  frontend_node_modules:
  backend_nuget:
